[project]
name = "rpi5-vision-pipeline"
version = "0.1.0"
description = "Embedded video processing pipeline with Shared Memory IPC"
authors = [
    {name = "zh1vch1k", email = "kyseliov.illia@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.5.1,<3.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "posix-ipc (>=1.3.2,<2.0.0)",
    "torch (>=2.2.0)",
    "torchvision (>=0.17.0)",
    "ultralytics (>=8.4.111,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
